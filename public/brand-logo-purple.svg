<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Vibrant purple gradient matching the uploaded reference -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
  </defs>

  <!-- Left Side: The "TNs" Icon -->
  <g transform="translate(10, 10) scale(0.4)">
    <!-- Thick circular border to mimic the circular lightning bolt shape -->
    <circle cx="250" cy="250" r="210" fill="none" stroke="url(#purpleGrad)" stroke-width="45" />
    
    <!-- Icon Text in matching purple -->
    <g transform="translate(250, 310)" text-anchor="middle">
      <text x="-40" y="0" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-weight="900" 
            font-size="200" 
            fill="url(#purpleGrad)" 
            letter-spacing="-8">TN</text>
      
      <text x="130" y="25" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-weight="900" 
            font-size="140" 
            fill="url(#purpleGrad)">s</text>
    </g>
  </g>

  <!-- Right Side: Single Line "Tune Onus" Text in Dark Navy -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" fill="#1E1B4B">
    <text x="240" y="145" font-size="95" letter-spacing="-2">Tune Onus</text>
  </g>
</svg>
