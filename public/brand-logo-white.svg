<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220">
  <!-- Left Side: The "TNs" Icon — transparent background, white rounded rect border -->
  <g transform="translate(10, 10) scale(0.4)">
    <!-- Rounded border with inner padding gap -->
    <rect x="25" y="25" width="450" height="450" rx="100" fill="none" stroke="#FFFFFF" stroke-width="18" />
    <!-- Inner gap clip: slightly smaller rect so text stays well inside -->
    
    <!-- Icon Text — pushed inward so border has breathing room -->
    <g transform="translate(250, 310)" text-anchor="middle">
      <!-- "TN" tight text -->
      <text x="-38" y="0" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-weight="900" 
            font-size="200" 
            fill="#FFFFFF" 
            letter-spacing="-15">TN</text>
      
      <!-- "s" — moved right -->
      <text x="130" y="15" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-weight="400" 
            font-size="210" 
            fill="#FFFFFF">s</text>
    </g>
  </g>

  <!-- Divider line -->
  <line x1="210" y1="30" x2="210" y2="190" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Right Side: Stacked "Tune" and "Onus" Text — all white -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" fill="#FFFFFF">
    <text x="240" y="100" font-size="95" letter-spacing="-2">Tune</text>
    <text x="240" y="195" font-size="95" letter-spacing="-2">Onus</text>
  </g>
</svg>
