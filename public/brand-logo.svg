<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="100%" height="100%">
  <!-- Left Side: The "TNs" Icon (Scaled to fit) -->
  <g transform="translate(10, 10) scale(0.4)">
    <!-- Base Icon Background -->
    <rect x="25" y="25" width="450" height="450" rx="100" fill="#000000" />
    
    <!-- Icon Text -->
    <g transform="translate(250, 300)" text-anchor="middle">
      <text x="-45" y="0" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-weight="900" 
            font-size="240" 
            fill="#FFFFFF" 
            letter-spacing="-8">TN</text>
      
      <text x="165" y="35" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-weight="900" 
            font-size="180" 
            fill="#FFFFFF">s</text>
    </g>
  </g>

  <!-- Right Side: Stacked "Tune" and "Onus" Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" fill="#FFFFFF">
    <text x="240" y="100" font-size="95" letter-spacing="-2">Tune</text>
    <text x="240" y="195" font-size="95" letter-spacing="-2">Onus</text>
  </g>
</svg>
