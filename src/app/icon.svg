<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Ultra-Minimalist Apple/Fintech Base (No Gradients, No Shadows) -->
  <rect x="25" y="25" width="450" height="450" rx="100" fill="#000000" />
  
  <g transform="translate(250, 300)" text-anchor="middle">
    <!-- Main "TN" -->
    <text x="-45" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="240" 
          fill="#FFFFFF" 
          letter-spacing="-8">TN</text>
    
    <!-- Subscript "s" -->
    <text x="165" y="35" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="180" 
          fill="#FFFFFF">s</text>
  </g>
</svg>
