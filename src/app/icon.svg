<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" /> <!-- Deep Purple -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Cyan -->
    </linearGradient>
  </defs>
  
  <!-- Premium squircle background -->
  <rect width="512" height="512" rx="128" fill="url(#brandGradient)" />
  
  <!-- Large, bold, highly legible "TN" for tiny sizes -->
  <text x="256" y="350" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="280" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="-15">TN</text>
</svg>
